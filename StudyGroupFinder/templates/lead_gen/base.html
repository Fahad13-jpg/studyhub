<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %} | Lead-Gen-system</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #182437; background: #f5f7fa; }
    body { margin: 0; } main { max-width: 760px; margin: 32px auto; padding: 32px; background: white; border: 1px solid #dce2e9; border-radius: 12px; }
    h1 { font-size: 2rem; line-height: 1.2; } h2 { margin-top: 2rem; font-size: 1.15rem; } p, li { line-height: 1.7; } li { margin: .5rem 0; }
    a { color: #1753a1; overflow-wrap: anywhere; } a:focus-visible { outline: 3px solid #1753a1; outline-offset: 4px; }
    nav { display: flex; flex-wrap: wrap; gap: 20px; } .note { border-left: 3px solid #1753a1; padding-left: 16px; } small { color: #4e5b6d; }
    footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #dce2e9; }
    @media (max-width: 600px) { main { margin: 0; padding: 22px; border-radius: 0; border: 0; } }
  </style>
</head>
<body><main>
  <nav aria-label="Lead-Gen-system policies"><a href="{% url 'lead_gen_policies:privacy' %}">Privacy policy</a><a href="{% url 'lead_gen_policies:data_deletion' %}">Data deletion</a></nav>
  {% block content %}{% endblock %}
  <footer><p>Contact: <a href="mailto:mohmmadfahad53408@gmail.com">mohmmadfahad53408@gmail.com</a></p><small>These pages describe Lead-Gen-system. They are temporarily hosted on the StudyHub website and do not describe StudyHub's separate services.</small></footer>
</main></body></html>
