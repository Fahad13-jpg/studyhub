<article class="desk-group-row"><div class="group-initial" aria-hidden="true">{{ group.course_code|slice:':2' }}</div><div><h3><a href="{% url 'groups:group_detail' group.pk %}">{{ group.name }}</a></h3><p>{{ group.course_code }} · {{ group.member_total }} / {{ group.max_capacity }} members</p>{% if owned %}<span class="owner-note">Created by you</span>{% endif %}</div><a class="desk-group-action" href="{% url 'groups:group_detail' group.pk %}" aria-label="{% if owned %}Manage{% else %}Open{% endif %} group: {{ group.name }}">{% if owned %}Manage{% else %}Open{% endif %}</a></article>
